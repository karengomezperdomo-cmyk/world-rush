<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RUSH 7 · Gameplay (layout A: full-screen)</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="../game.css" />
  </head>
  <body>
    <script src="../icons.js"></script>
    <div class="phone game">
      <div class="world"><img class="pix" src="../art/scenes/gameplay-canyon.png" alt="" /></div>

      <div class="status">
        <span>9:41</span>
        <span class="sys"
          ><svg viewBox="0 0 18 12"><use href="#signal" /></svg
          ><svg viewBox="0 0 17 12"><use href="#wifi" /></svg
          ><svg viewBox="0 0 27 12"><use href="#battery" /></svg
        ></span>
      </div>

      <!-- HUD: everything sits left of the top-right corner, which World App keeps for its own controls -->
      <div class="hud-top">
        <div class="round-btn notch"><svg class="i"><use href="#pause" /></svg></div>
        <div>
          <div class="timer notch">
            <div class="l">TIME</div>
            <div class="t">00:23<small>.481</small></div>
          </div>
          <div class="hud-sub">
            <span class="chip good notch">CP 2 &nbsp;−0.412</span>
            <span class="cp-pips">
              <span class="pip done notch"><svg class="i"><use href="#check" /></svg></span>
              <span class="pip done notch"><svg class="i"><use href="#check" /></svg></span>
              <span class="pip next notch"></span>
            </span>
          </div>
        </div>
      </div>

      <div class="track notch">
        <div class="fill" style="width: 58%"></div>
        <i class="mk" style="left: 25%"></i><i class="mk" style="left: 50%"></i><i class="mk" style="left: 75%"></i>
        <i class="me" style="left: 58%"></i>
        <i class="goal"></i>
      </div>

      <div class="pads-a">
        <div class="pad lean p-back notch"><svg class="i"><use href="#lean-back" /></svg><span>LEAN BACK</span></div>
        <div class="pad lean p-fwd notch"><svg class="i"><use href="#lean-fwd" /></svg><span>LEAN FWD</span></div>
        <div class="pad brake p-brake notch"><svg class="i"><use href="#brake" /></svg><span>BRAKE</span></div>
        <div class="pad gas p-gas notch down"><svg class="i"><use href="#gas" /></svg><span>GAS</span></div>
      </div>

      <div class="homebar"></div>

      <div class="zones">
        <div class="zone-reserved">RESERVED<br />WORLD APP<br />CONTROLS</div>
        <div class="zone-safe-top">SAFE AREA · TOP 47</div>
        <div class="zone-safe-bottom">SAFE AREA · BOTTOM 34</div>
        <div class="zone-thumb l">LEFT THUMB<br />LEAN BACK · LEAN FWD</div>
        <div class="zone-thumb r">RIGHT THUMB<br />BRAKE · GAS</div>
        <div class="zone-note">HUD: PAUSE · TIMER · SPLIT · CHECKPOINTS · PROGRESS</div>
      </div>
    </div>
    <script>
      if (location.search.includes('zones')) document.querySelector('.phone').classList.add('show-zones');
    </script>
  </body>
</html>
