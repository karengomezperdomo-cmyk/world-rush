<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RUSH 7 · Finish</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="../game.css" />
  </head>
  <body>
    <script src="../icons.js"></script>
    <div class="phone game">
      <div class="world"><img class="pix" src="../art/scenes/gameplay-canyon.png" alt="" /></div>
      <div class="status">
        <span>9:41</span>
        <span class="sys"
          ><svg viewBox="0 0 18 12"><use href="#signal" /></svg
          ><svg viewBox="0 0 17 12"><use href="#wifi" /></svg
          ><svg viewBox="0 0 27 12"><use href="#battery" /></svg
        ></span>
      </div>
      <div class="scrim heavy"></div>

      <div class="modal notch" style="top: 112px; padding-top: 14px">
        <div class="eyebrow">MAP 1 · SUNSET CANYON</div>
        <div class="banner gold" style="margin: 8px 0 4px">FINISH!</div>
        <div class="hint" style="margin-bottom: 8px">YOUR TIME</div>
        <div class="big-time">00:39<small>.748</small></div>
        <div class="ribbon" style="margin: 12px 4px 10px"><svg class="i"><use href="#crown" /></svg>NEW PERSONAL BEST −1.482</div>

        <div class="stack" style="gap: 6px">
          <div class="row-kv notch"><span class="k">BEST TIME</span><span class="v gold">00:39.748</span></div>
          <div class="row-kv notch"><span class="k">RANK</span><span class="v green">#128 <small style="font-size: 12px; color: var(--muted)">/ 3,421</small></span></div>
        </div>

        <div style="margin-top: 8px">
          <div class="split-row"><span>CP 1</span><b>00:11.204</b><span class="good">−0.301</span></div>
          <div class="split-row"><span>CP 2</span><b>00:23.481</b><span class="good">−0.412</span></div>
          <div class="split-row"><span>CP 3</span><b>00:33.118</b><span class="good">−0.905</span></div>
        </div>

        <div class="chip good notch" style="display: flex; justify-content: center; margin: 8px 2px 12px; width: calc(100% - 4px)">
          <svg class="i"><use href="#check" /></svg>VERIFIED BY THE SERVER
        </div>

        <div class="stack" style="gap: 8px">
          <button class="btn btn-primary" style="margin-bottom: 6px"><svg class="line" viewBox="0 0 24 24"><use href="#refresh" /></svg>TRY AGAIN</button>
          <button class="btn btn-secondary notch"><svg class="i" style="width: 22px; height: 22px; color: #7f9bff"><use href="#bars" /></svg>LEADERBOARD</button>
          <button class="btn btn-ghost" style="height: 30px">BACK TO HOME</button>
        </div>
      </div>
      <div class="homebar"></div>
    </div>
  </body>
</html>
