<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>RUSH 7 · Verify</title>
    <link rel="stylesheet" href="../tokens.css" />
    <link rel="stylesheet" href="../ui.css" />
    <link rel="stylesheet" href="../game.css" />
    <link rel="stylesheet" href="../screens.css" />
  </head>
  <body>
    <script src="../icons.js"></script>
    <div class="phone">
      <div class="status">
        <span>9:41</span>
        <span class="sys"
          ><svg viewBox="0 0 18 12"><use href="#signal" /></svg
          ><svg viewBox="0 0 17 12"><use href="#wifi" /></svg
          ><svg viewBox="0 0 27 12"><use href="#battery" /></svg
        ></span>
      </div>

      <div class="page no-tabs">
        <div style="display: flex; justify-content: center; padding-top: 6px">
          <img class="logo pix" src="../art/logo/rush7.png" alt="RUSH 7" style="height: 56px" />
        </div>

        <div class="notch" style="margin: 12px 20px 0; height: 128px; overflow: hidden; --nb: var(--line)">
          <img class="pix" src="../art/scenes/hero-sunset-canyon.png" alt="" style="display: block; width: 350px; height: 366px; margin-top: -84px" />
        </div>

        <div class="banner" style="margin: 18px 0 6px; font-size: 40px">PROVE YOU'RE HUMAN</div>
        <p class="hint" style="padding: 0 34px 14px">One human, one leaderboard spot.<br />Verify once and you're set.</p>

        <div class="step done notch">
          <div class="n"><svg class="i" style="width: 20px; height: 20px; stroke-width: 3.4"><use href="#check" /></svg></div>
          <div>
            <div class="t">Sign in</div>
            <div class="d">Connected with your wallet.</div>
          </div>
        </div>
        <div class="step now notch">
          <div class="n">2</div>
          <div>
            <div class="t">Verify you're a unique human</div>
            <div class="d">A quick check, once. Only an anonymous proof is stored.</div>
          </div>
        </div>

        <div style="padding: 6px 18px 0">
          <button class="btn btn-primary"><svg class="line" viewBox="0 0 24 24"><use href="#check" /></svg>VERIFY NOW</button>
          <button class="btn btn-ghost" style="margin-top: 4px">PRACTICE FIRST · NO RANKING</button>
        </div>

        <div class="bullets" style="margin-top: 8px">
          <div><svg class="i"><use href="#check" /></svg>No bots on the leaderboard.</div>
          <div><svg class="i"><use href="#check" /></svg>We never ask for funds, ID documents or your real name.</div>
        </div>

      </div>
      <div class="homebar"></div>
    </div>
  </body>
</html>
