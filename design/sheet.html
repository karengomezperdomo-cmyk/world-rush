<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>RUSH 7 · Contact sheet</title>
    <link rel="stylesheet" href="tokens.css" />
    <style>
      body {
        margin: 0;
        padding: 24px;
        width: 1882px;
        background: #070a1a;
        color: #f1f5ff;
        font-family: var(--font-ui);
      }
      h1 {
        margin: 0 0 16px;
        font: 400 34px/1 var(--font-display);
        letter-spacing: 0.04em;
      }
      h1 span {
        color: #8ea0d4;
        font: 500 14px var(--font-ui);
        letter-spacing: 0.12em;
        margin-left: 14px;
      }
      .g {
        display: grid;
        grid-template-columns: repeat(7, 250px);
        gap: 14px;
      }
      figure {
        margin: 0;
      }
      img {
        display: block;
        width: 250px;
        height: 541px;
        border: 2px solid #1b2f6e;
      }
      figcaption {
        margin-top: 6px;
        font: 600 12px var(--font-ui);
        letter-spacing: 0.1em;
        color: #8ea0d4;
      }
    </style>
  </head>
  <body>
    <h1>RUSH 7<span>DESIGN OVERVIEW · PROVISIONAL ART · 390 × 844</span></h1>
    <div class="g">
      <figure><img src="screens/png/home.png" alt="" /><figcaption>HOME</figcaption></figure>
      <figure><img src="screens/png/verify.png" alt="" /><figcaption>VERIFY</figcaption></figure>
      <figure><img src="screens/png/gameplay-a.png" alt="" /><figcaption>GAMEPLAY · LAYOUT A</figcaption></figure>
      <figure><img src="screens/png/gameplay-b.png" alt="" /><figcaption>GAMEPLAY · LAYOUT B</figcaption></figure>
      <figure><img src="screens/png/crash.png" alt="" /><figcaption>CRASH / RESPAWN</figcaption></figure>
      <figure><img src="screens/png/pause.png" alt="" /><figcaption>PAUSE</figcaption></figure>
      <figure><img src="screens/png/finish.png" alt="" /><figcaption>FINISH</figcaption></figure>
      <figure><img src="screens/png/leaderboard.png" alt="" /><figcaption>LEADERBOARD</figcaption></figure>
      <figure><img src="screens/png/profile.png" alt="" /><figcaption>PROFILE</figcaption></figure>
      <figure><img src="screens/png/results.png" alt="" /><figcaption>WEEK RESULTS</figcaption></figure>
      <figure><img src="screens/png/how-to-play.png" alt="" /><figcaption>HOW TO PLAY</figcaption></figure>
      <figure><img src="screens/png/settings.png" alt="" /><figcaption>SETTINGS</figcaption></figure>
      <figure><img src="screens/png/states.png" alt="" /><figcaption>STATES</figcaption></figure>
      <figure><img src="screens/png/gameplay-a-zones.png" alt="" /><figcaption>LAYOUT A · SAFE ZONES</figcaption></figure>
    </div>
  </body>
</html>
